name: CI

on:
  push:
    branches:
      - "**"
    paths:
      - "infra/**"

permissions:
  contents: read

jobs:
  fmt-lint-check:
    runs-on: ubuntu-latest
    name: Format and Lint check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Format check
        run: make fmtchk
